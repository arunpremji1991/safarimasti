# Builds the static site on every push to main and publishes the result to the
# `deploy` branch. Hostinger's Git integration pulls that branch into public_html.
name: Build static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # next/font downloads Google Fonts at build time; retry if the network hiccups.
      - name: Build
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed; retrying..."
            sleep 20
          done
          exit 1

      - name: Publish ./out to the deploy branch
        run: |
          cd out
          # Keep the server-only SMTP config out of the deploy branch.
          printf 'api/config.php\n' > .gitignore
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
